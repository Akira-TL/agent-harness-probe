# Synthetic Agent Harness HTTP probe (owned by ~/Downloads/agent-harness-probe).
# This include belongs INSIDE the existing babelbeast.com SSL server block.
location ^~ /agent-harness-probe/ {
    # No request bodies, no arbitrary target fetching, only passive probes.
    limit_except GET HEAD { deny all; }
    client_max_body_size 1k;

    proxy_pass http://127.0.0.1:18768/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_intercept_errors off;

    # Avoid writing the ephemeral access token into global access logs.
    access_log off;
    add_header X-Agent-Harness-Probe "synthetic-only" always;
    add_header X-Content-Type-Options nosniff always;
}
